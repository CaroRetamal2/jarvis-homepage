<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TIM IA · Web Embed</title>

  <style>
    :root{
      --bg: #1B2343;
      --text: #ECEFF1;
      --muted: rgba(236,239,241,.75);
      --card: #FFFFFF;
      --radius: 28px;
      --shadow: 0 22px 60px rgba(0,0,0,.35);
      --max: 1800px;
      --cardMaxH: 520px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body{
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 28px 28px 34px;
      gap: 18px;
    }

    .top{
      max-width: var(--max);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-top: 6px;
      flex: 0 0 auto;
    }

    .logo{
      width: 78px;
      height: 64px;
      display: grid;
      place-items: center;
      user-select: none;
    }
    .logo svg{ display:block; width: 78px; height: 64px; }

    .nav{
      display: flex;
      align-items: center;
      gap: 28px;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: .2px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav a{
      color: var(--text);
      text-decoration: none;
      padding: 6px 4px;
      line-height: 1;
      opacity: .95;
    }
    .nav a:hover{ opacity: 1; }
    .nav a.active{
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 2px;
    }

    /* CARD:
       - intenta usar TODO el alto disponible
       - pero si eso excede 520px, limita a 520px
       - (sin scroll externo para evitar doble scroll)
    */
    .card{
      max-width: var(--max);
      width: 100%;
      margin: 0 auto;

      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      /* ocupa el resto del alto de la página */
      flex: 1 1 auto;

      /* clave: usar todo lo disponible, pero tope 520px */
      height: 100%;
      max-height: var(--cardMaxH);

      overflow: hidden; /* ✅ sin scroll externo */
    }

    /* iframe siempre llena el card */
    iframe{
      width: 100%;
      height: 100%;
      min-height: 520px;
      border: 0;
      display: block;
      background: #fff;
    }

    .micro{
      max-width: var(--max);
      width: 100%;
      margin: 0 auto;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      padding-top: 2px;
      flex: 0 0 auto;
    }

    @media (max-width: 820px){
      .wrap{ padding: 18px 16px 22px; }
      .nav{ font-size: 18px; gap: 18px; }
      .logo{ transform: scale(.9); }
      iframe{ min-height: 420px; }
      :root{ --cardMaxH: 520px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="top">
      <div class="logo" aria-label="Logo TIM IA">
        <img src="logo.svg" alt="Logo TIM IA" width="73">
        <!-- ✅ quitado el </svg> suelto -->
      </div>

      <nav class="nav" aria-label="Navegación">
        <a href="#" class="navlink active" data-url="https://realtime.ai.timlabtesting.com/crushers">Gestión Colas</a>
        <a href="#" class="navlink" data-url="https://chat.ai.timlabtesting.com/c/new">TIM IA</a>
        <a href="#" class="navlink" data-url="https://drive.google.com/file/d/1_tTqpheBIUdLTb5-QseuzTHgEFut109e/preview">Reportes</a>
      </nav>
    </header>

    <main class="card">
      <!-- ✅ Solo agrego atributos útiles al iframe -->
      <iframe
        id="embed"
        title="Contenido embebido"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="fullscreen; clipboard-read; clipboard-write"
        allowfullscreen
      ></iframe>
    </main>
  </div>

  <script>
    const links = Array.from(document.querySelectorAll('.navlink'));
    const iframe = document.getElementById('embed');

    function setActive(link){
      links.forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      const url = link.dataset.url || '';
      if (url) iframe.src = url;
    }

    links.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        setActive(link);
      });
    });

    const initial = document.querySelector('.navlink.active') || links[0];
    if (initial) setActive(initial);
  </script>
</body>
</html>
